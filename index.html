<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>সাফল্য টিউশন সেন্টার - প্রশ্নপত্র নির্মাতা (২০২৬ সিলেবাস)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Serif Bengali -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Serif Bengali', serif;
    }
    .editing-active {
      outline: 2px dashed #4f46e5;
      background-color: #fefce8 !important;
    }
    /* Decreased PDF / Print Margins */
    @media print {
      @page {
        size: A4;
        margin: 5mm 6mm !important;
      }
      body {
        background: #ffffff !important;
        color: #000000 !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      #paperContainer {
        box-shadow: none !important;
        border: none !important;
        outline: none !important;
        background-color: #ffffff !important;
        padding: 2mm !important;
        margin: 0 !important;
        max-width: 100% !important;
        width: 100% !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen py-6 px-3 sm:px-6">

  <!-- Control Panel (Hidden when printing PDF) -->
  <div class="max-w-4xl mx-auto no-print mb-6">
    <div class="bg-white rounded-2xl shadow-md border border-slate-200 p-5 sm:p-8">
      <div class="border-b border-slate-200 pb-4 mb-6 flex flex-wrap items-center justify-between gap-2">
        <div>
          <h1 class="text-2xl sm:text-3xl font-bold text-indigo-950">
            সাফল্য টিউশন সেন্টার — প্রশ্নপত্র নির্মাতা
          </h1>
          <p class="text-slate-600 mt-1 text-sm sm:text-base">
            ২০২৬ সালের পশ্চিমবঙ্গ পর্ষদ (WBBPE, WBBSE ও WBCHSE) নতুন সিলেবাস অনুযায়ী
          </p>
        </div>
        <span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-3 py-1.5 rounded-full">
          ২০২৬ সিলেবাস আপডেট
        </span>
      </div>

      <form id="paperForm" class="space-y-4">
        <!-- Institute Header & Exam Term -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">
              প্রতিষ্ঠানের নাম (Header Title)
            </label>
            <input
              id="instituteName"
              type="text"
              value="সাফল্য টিউশন সেন্টার"
              class="w-full rounded-lg border border-slate-300 px-3.5 py-2 focus:ring-2 focus:ring-indigo-600 focus:outline-none font-semibold"
            />
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">
              পরীক্ষার ধরন / মূল্যায়ন (২০২৬ সিলেবাস)
            </label>
            <select
              id="examTitle"
              class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 bg-white focus:ring-2 focus:ring-indigo-600 focus:outline-none"
            >
              <option value="১ম পর্যায়ক্রমিক মূল্যায়ন - ২০২৬ (1st Summative)">১ম পর্যায়ক্রমিক মূল্যায়ন - ২০২৬ (1st Summative)</option>
              <option value="২য় পর্যায়ক্রমিক মূল্যায়ন - ২০২৬ (2nd Summative)">২য় পর্যায়ক্রমিক মূল্যায়ন - ২০২৬ (2nd Summative)</option>
              <option value="বার্ষিক মূল্যায়ন - ২০২৬ (3rd Summative / Final)" selected>বার্ষিক মূল্যায়ন - ২০২৬ (3rd Summative / Final)</option>
              <option value="উচ্চমাধ্যমিক সেমিস্টার মূল্যায়ন - ২০২৬">উচ্চমাধ্যমিক সেমিস্টার মূল্যায়ন - ২০২৬</option>
              <option value="মাসিক মূল্যায়ন পরীক্ষা - ২০২৬">মাসিক মূল্যায়ন পরীক্ষা - ২০২৬</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Class Selector -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">
              শ্রেণি নির্বাচন করুন (Class 1 - 12)
            </label>
            <select id="selectedClass" class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 bg-white focus:ring-2 focus:ring-indigo-600 focus:outline-none">
              <option value="1">Class 1 (১ম শ্রেণি - WBBPE)</option>
              <option value="2">Class 2 (২য় শ্রেণি - WBBPE)</option>
              <option value="3">Class 3 (৩য় শ্রেণি - WBBPE)</option>
              <option value="4">Class 4 (৪র্থ শ্রেণি - WBBPE)</option>
              <option value="5">Class 5 (৫ম শ্রেণি - WBBSE)</option>
              <option value="6">Class 6 (৬ষ্ঠ শ্রেণি - WBBSE)</option>
              <option value="7">Class 7 (৭ম শ্রেণি - WBBSE)</option>
              <option value="8">Class 8 (৮ম শ্রেণি - WBBSE)</option>
              <option value="9">Class 9 (৯ম শ্রেণি - WBBSE)</option>
              <option value="10" selected>Class 10 (১০ম শ্রেণি - WBBSE)</option>
              <option value="11">Class 11 (১১শ শ্রেণি - WBCHSE)</option>
              <option value="12">Class 12 (১২শ শ্রেণি - WBCHSE)</option>
            </select>
          </div>

          <!-- Subject Selector -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">
              বিষয় (Subject)
            </label>
            <select id="subject" class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 bg-white focus:ring-2 focus:ring-indigo-600 focus:outline-none">
              <option value="বাংলা (Bengali)">বাংলা (Bengali)</option>
              <option value="গণিত (Mathematics)">গণিত (Mathematics)</option>
              <option value="ভৌতবিজ্ঞান (Physical Science)" selected>ভৌতবিজ্ঞান (Physical Science)</option>
              <option value="জীবনবিজ্ঞান (Life Science)">জীবনবিজ্ঞান (Life Science)</option>
              <option value="ইতিহাস (History)">ইতিহাস (History)</option>
              <option value="ভূগোল (Geography)">ভূগোল (Geography)</option>
              <option value="পরিবেশ ও বিজ্ঞান (Environment & Science)">পরিবেশ ও বিজ্ঞান (Environment & Science)</option>
              <option value="আমাদের পরিবেশ (Amader Paribesh)">আমাদের পরিবেশ (Amader Paribesh)</option>
              <option value="পাতাবাহার (বাংলা - প্রাথমিক)">পাতাবাহার (বাংলা - প্রাথমিক)</option>
              <option value="আমার গণিত (প্রাথমিক)">আমার গণিত (প্রাথমিক)</option>
              <option value="পদার্থবিদ্যা (Physics)">পদার্থবিদ্যা (Physics - XI/XII)</option>
              <option value="রসায়ন (Chemistry)">রসায়ন (Chemistry - XI/XII)</option>
              <option value="জীববিদ্যা (Biology)">জীববিদ্যা (Biology - XI/XII)</option>
              <option value="রাষ্ট্রবিজ্ঞান (Political Science)">রাষ্ট্রবিজ্ঞান (Political Science)</option>
              <option value="দর্শন (Philosophy)">দর্শন (Philosophy)</option>
              <option value="শিক্ষাবিজ্ঞান (Education)">শিক্ষাবিজ্ঞান (Education)</option>
              <option value="হিসাবশাস্ত্র (Accountancy)">হিসাবশাস্ত্র (Accountancy)</option>
              <option value="কারবারি শিক্ষা (Business Studies)">কারবারি শিক্ষা (Business Studies)</option>
              <option value="অর্থনীতি (Economics)">অর্থনীতি (Economics)</option>
              <option value="কম্পিউটার অ্যাপ্লিকেশন (Computer Application)">কম্পিউটার অ্যাপ্লিকেশন (Computer Application)</option>
            </select>
          </div>
        </div>

        <!-- Topics / Chapters Input -->
        <div>
          <div class="flex flex-wrap items-center justify-between gap-2 mb-1">
            <label class="block text-sm font-semibold text-slate-700">
              অধ্যায় বা বিষয়বস্তু (Topics / Chapters)
            </label>
            <button
              type="button"
              id="autoSyllabusBtn"
              class="text-xs font-semibold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 px-2.5 py-1 rounded-md border border-indigo-200"
            >
              ✨ ২০২৬ সালের সম্পূর্ণ সিলেবাস সেট করুন
            </button>
          </div>
          <textarea
            id="topics"
            rows="2"
            required
            placeholder="নির্দিষ্ট অধ্যায়ের নাম লিখুন অথবা '২০২৬ সালের সিলেবাস অনুযায়ী সব অধ্যায়' রাখুন"
            class="w-full rounded-lg border border-slate-300 px-3.5 py-2 focus:ring-2 focus:ring-indigo-600 focus:outline-none"
          >২০২৬ সালের সিলেবাস অনুযায়ী সব অধ্যায়</textarea>
        </div>

        <!-- Marks & Question Counts -->
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">পূর্ণমান (Full Marks)</label>
            <input id="fullMarks" type="number" min="5" max="100" value="40" class="w-full rounded-lg border border-slate-300 px-3 py-2" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">MCQ সংখ্যা (×১)</label>
            <input id="mcqCount" type="number" min="0" max="50" value="10" class="w-full rounded-lg border border-slate-300 px-3 py-2" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">শূন্যস্থান সংখ্যা (×১)</label>
            <input id="fillBlanksCount" type="number" min="0" max="50" value="10" class="w-full rounded-lg border border-slate-300 px-3 py-2" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">বড় প্রশ্নের সংখ্যা</label>
            <input id="longQCount" type="number" min="0" max="25" value="4" class="w-full rounded-lg border border-slate-300 px-3 py-2" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">প্রতিটি বড় প্রশ্নের মান</label>
            <input id="longQMarksEach" type="number" min="2" max="15" value="5" class="w-full rounded-lg border border-slate-300 px-3 py-2" />
          </div>
        </div>

        <!-- Marks Tally Banner -->
        <div id="marksBanner" class="p-3 rounded-lg text-sm bg-emerald-50 text-emerald-800 border border-emerald-200 flex items-center justify-between">
          <span id="marksSummaryText"></span>
          <button type="button" id="syncMarksBtn" class="hidden text-xs font-semibold underline">পূর্ণমান মেলান</button>
        </div>

        <!-- Error Message Box -->
        <div id="errorBox" class="hidden p-4 rounded-lg bg-red-50 text-red-700 text-sm border border-red-200"></div>

        <!-- Action Buttons -->
        <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
          <button
            type="submit"
            id="generateBtn"
            class="bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white font-semibold px-6 py-3 rounded-xl shadow-sm transition cursor-pointer"
          >
            প্রশ্নপত্র তৈরি করুন (Generate Paper)
          </button>

          <div id="paperActions" class="hidden flex flex-wrap items-center gap-2">
            <button
              type="button"
              id="toggleEditBtn"
              class="px-4 py-2.5 rounded-xl border border-indigo-600 bg-indigo-50 text-indigo-800 hover:bg-indigo-100 text-sm font-semibold"
            >
              ✏️ এডিট চালু আছে (Edit On)
            </button>
            <button
              type="button"
              id="toggleAnswersBtn"
              class="px-4 py-2.5 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-100 text-sm font-medium"
            >
              উত্তরপত্র দেখুন (Answer Key)
            </button>
            <button
              type="button"
              onclick="window.print()"
              class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-sm font-semibold shadow-sm"
            >
              প্রিন্ট / PDF ডাউনলোড
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Mode Helper Banner -->
  <div id="editHelperBanner" class="hidden max-w-4xl mx-auto no-print mb-3 bg-amber-50 border border-amber-300 text-amber-900 px-4 py-2.5 rounded-xl text-xs sm:text-sm flex items-center justify-between">
    <span>💡 <strong>এডিট অপশন চালু:</strong> নিচের প্রশ্নপত্রের যেকোনো লেখার ওপর ট্যাপ করে সরাসরি পরিবর্তন বা মুছে ফেলতে পারবেন। (এই বার্তাটি PDF-এ আসবে না)</span>
  </div>

  <!-- Printable & Editable Question Paper Container -->
  <div
    id="paperContainer"
    contenteditable="true"
    spellcheck="false"
    class="hidden max-w-4xl mx-auto bg-white shadow-lg border border-slate-200 p-4 sm:p-8 rounded-xl editing-active focus:outline-indigo-600"
  ></div>

  <script>
    const bengaliDigits = ["০", "১", "২", "৩", "৪", "৫", "৬", "৭", "৮", "৯"];
    const optionLabels = ["ক", "খ", "গ", "ঘ"];
    const toBn = (n) => String(n).replace(/[0-9]/g, (w) => bengaliDigits[+w]);

    const instituteNameEl = document.getElementById("instituteName");
    const examTitleEl = document.getElementById("examTitle");
    const topicsEl = document.getElementById("topics");
    const fullMarksEl = document.getElementById("fullMarks");
    const mcqCountEl = document.getElementById("mcqCount");
    const fillBlanksCountEl = document.getElementById("fillBlanksCount");
    const longQCountEl = document.getElementById("longQCount");
    const longQMarksEachEl = document.getElementById("longQMarksEach");
    const marksBanner = document.getElementById("marksBanner");
    const marksSummaryText = document.getElementById("marksSummaryText");
    const syncMarksBtn = document.getElementById("syncMarksBtn");
    const paperContainer = document.getElementById("paperContainer");
    const editHelperBanner = document.getElementById("editHelperBanner");

    let currentPaper = null;
    let showAnswers = false;
    let isEditable = true;

    document.getElementById("autoSyllabusBtn").addEventListener("click", () => {
      topicsEl.value = "২০২৬ সালের সিলেবাস অনুযায়ী সব অধ্যায়";
    });

    function updateMarksTally() {
      const fm = Number(fullMarksEl.value) || 0;
      const mcq = Number(mcqCountEl.value) || 0;
      const fb = Number(fillBlanksCountEl.value) || 0;
      const lq = Number(longQCountEl.value) || 0;
      const lqm = Number(longQMarksEachEl.value) || 0;
      const total = mcq + fb + lq * lqm;

      marksSummaryText.innerHTML = `প্রশ্নের মোট নম্বর হিসাব: <strong>(${toBn(mcq)}×১) + (${toBn(fb)}×১) + (${toBn(lq)}×${toBn(lqm)}) = ${toBn(total)}</strong>`;

      if (total === fm) {
        marksBanner.className = "p-3 rounded-lg text-sm bg-emerald-50 text-emerald-800 border border-emerald-200 flex items-center justify-between";
        syncMarksBtn.classList.add("hidden");
      } else {
        marksBanner.className = "p-3 rounded-lg text-sm bg-amber-50 text-amber-800 border border-amber-200 flex items-center justify-between";
        syncMarksBtn.classList.remove("hidden");
        syncMarksBtn.onclick = () => {
          fullMarksEl.value = total;
          updateMarksTally();
        };
      }
    }

    [fullMarksEl, mcqCountEl, fillBlanksCountEl, longQCountEl, longQMarksEachEl].forEach(el => {
      el.addEventListener("input", updateMarksTally);
    });
    updateMarksTally();

    function renderPaper() {
      if (!currentPaper) return;
      const topics = topicsEl.value;
      const fm = fullMarksEl.value;
      const lqm = Number(longQMarksEachEl.value) || 5;
      const headerName = instituteNameEl.value.trim() || "সাফল্য টিউশন সেন্টার";
      const examSubtitle = examTitleEl.value.replace(/\s*\(.*?\)\s*/g, "").trim();

      let html = `
        <div class="text-center border-b-2 border-slate-900 pb-2.5 mb-4">
          <h2 class="text-xl sm:text-2xl font-bold">${headerName}</h2>
          ${examSubtitle ? `<p class="text-base sm:text-lg font-semibold mt-0.5">${examSubtitle}</p>` : ""}
          <p class="text-sm sm:text-base font-semibold mt-0.5">শ্রেণি: ${currentPaper.classNameBengali || ""} | বিষয়: ${currentPaper.subjectBengali || ""}</p>
          <p class="text-xs sm:text-sm text-slate-700 mt-0.5">পাঠ্যসূচি: ${topics}</p>
          <div class="flex justify-between items-center mt-2 text-sm sm:text-base font-semibold">
            <span>সময়: ${currentPaper.timeAllowedBengali || "১ ঘণ্টা ৩০ মিনিট"}</span>
            <span>পূর্ণমান: ${toBn(fm)}</span>
          </div>
        </div>
      `;

      if (currentPaper.mcqs && currentPaper.mcqs.length > 0) {
        html += `
          <section class="mb-5">
            <div class="flex justify-between items-baseline font-bold text-sm sm:text-base mb-2.5 border-b border-slate-300 pb-1">
              <h3>১। সঠিক উত্তরটি নির্বাচন করে লেখো (MCQ):</h3>
              <span>১ × ${toBn(currentPaper.mcqs.length)} = ${toBn(currentPaper.mcqs.length)}</span>
            </div>
            <ol class="space-y-2.5 text-sm sm:text-base">
              ${currentPaper.mcqs.map((item, i) => `
                <li class="leading-snug">
                  <div class="font-medium">১.${toBn(i + 1)} ${item.question}</div>
                  <div class="grid grid-cols-2 sm:grid-cols-4 gap-1.5 mt-1 pl-4 text-sm">
                    ${(item.options || []).map((opt, oi) => `<div>(${optionLabels[oi] || oi + 1}) ${opt}</div>`).join("")}
                  </div>
                  <div class="answer-key-item ${showAnswers ? "" : "hidden"} mt-1 pl-4 text-xs font-semibold text-emerald-700">উত্তর: ${item.answer}</div>
                </li>
              `).join("")}
            </ol>
          </section>
        `;
      }

      if (currentPaper.fillInTheBlanks && currentPaper.fillInTheBlanks.length > 0) {
        html += `
          <section class="mb-5">
            <div class="flex justify-between items-baseline font-bold text-sm sm:text-base mb-2.5 border-b border-slate-300 pb-1">
              <h3>২। উপযুক্ত শব্দ বসিয়ে শূন্যস্থান পূরণ করো:</h3>
              <span>১ × ${toBn(currentPaper.fillInTheBlanks.length)} = ${toBn(currentPaper.fillInTheBlanks.length)}</span>
            </div>
            <ol class="space-y-2 text-sm sm:text-base">
              ${currentPaper.fillInTheBlanks.map((item, i) => `
                <li class="leading-snug">
                  <div>২.${toBn(i + 1)} ${item.question}</div>
                  <div class="answer-key-item ${showAnswers ? "" : "hidden"} mt-0.5 pl-4 text-xs font-semibold text-emerald-700">উত্তর: ${item.answer}</div>
                </li>
              `).join("")}
            </ol>
          </section>
        `;
      }

      if (currentPaper.longQuestions && currentPaper.longQuestions.length > 0) {
        html += `
          <section class="mb-4">
            <div class="flex justify-between items-baseline font-bold text-sm sm:text-base mb-2.5 border-b border-slate-300 pb-1">
              <h3>৩। নিম্নলিখিত প্রশ্নগুলির বিস্তারিত উত্তর দাও:</h3>
              <span>${toBn(lqm)} × ${toBn(currentPaper.longQuestions.length)} = ${toBn(lqm * currentPaper.longQuestions.length)}</span>
            </div>
            <ol class="space-y-2.5 text-sm sm:text-base">
              ${currentPaper.longQuestions.map((item, i) => `
                <li class="leading-snug">
                  <div class="flex justify-between items-start gap-3">
                    <div>
                      <span class="font-medium">৩.${toBn(i + 1)} ${item.question}</span>
                      ${item.orQuestion ? `<div class="mt-0.5 pl-5 text-slate-800"><span class="font-bold italic mr-1.5">[অথবা]</span>${item.orQuestion}</div>` : ""}
                    </div>
                    <span class="text-sm font-semibold whitespace-nowrap">[${toBn(item.marks || lqm)}]</span>
                  </div>
                  <div class="answer-key-item ${showAnswers ? "" : "hidden"} mt-1 pl-4 text-xs font-semibold text-emerald-700">উত্তর সংকেত: ${item.answerHint}</div>
                </li>
              `).join("")}
            </ol>
          </section>
        `;
      }

      paperContainer.innerHTML = html;
      paperContainer.classList.remove("hidden");
      editHelperBanner.classList.remove("hidden");
    }

    document.getElementById("toggleEditBtn").addEventListener("click", (e) => {
      isEditable = !isEditable;
      paperContainer.contentEditable = isEditable ? "true" : "false";
      if (isEditable) {
        paperContainer.classList.add("editing-active");
        editHelperBanner.classList.remove("hidden");
        e.target.textContent = "✏️ এডিট চালু আছে (Edit On)";
        e.target.className = "px-4 py-2.5 rounded-xl border border-indigo-600 bg-indigo-50 text-indigo-800 hover:bg-indigo-100 text-sm font-semibold";
      } else {
        paperContainer.classList.remove("editing-active");
        editHelperBanner.classList.add("hidden");
        e.target.textContent = "🔒 এডিট বন্ধ (Edit Off)";
        e.target.className = "px-4 py-2.5 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-100 text-sm font-medium";
      }
    });

    document.getElementById("toggleAnswersBtn").addEventListener("click", (e) => {
      showAnswers = !showAnswers;
      e.target.textContent = showAnswers ? "উত্তর লুকান (Hide Answers)" : "উত্তরপত্র দেখুন (Answer Key)";
      document.querySelectorAll(".answer-key-item").forEach((el) => {
        el.classList.toggle("hidden", !showAnswers);
      });
    });

    document.getElementById("paperForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("generateBtn");
      const errorBox = document.getElementById("errorBox");
      btn.disabled = true;
      btn.textContent = "২০২৬ সিলেবাস অনুযায়ী প্রশ্নপত্র তৈরি হচ্ছে...";
      errorBox.classList.add("hidden");

      try {
        const res = await fetch("/api/generate-paper", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            selectedClass: Number(document.getElementById("selectedClass").value),
            subject: document.getElementById("subject").value,
            examTitle: examTitleEl.value,
            topics: topicsEl.value,
            fullMarks: Number(fullMarksEl.value),
            mcqCount: Number(mcqCountEl.value),
            fillBlanksCount: Number(fillBlanksCountEl.value),
            longQCount: Number(longQCountEl.value),
            longQMarksEach: Number(longQMarksEachEl.value),
          }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "প্রশ্নপত্র তৈরি করতে সমস্যা হয়েছে।");

        currentPaper = data;
        document.getElementById("paperActions").classList.remove("hidden");
        renderPaper();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.textContent = "প্রশ্নপত্র তৈরি করুন (Generate Paper)";
      }
    });
  </script>
</body>
</html>
